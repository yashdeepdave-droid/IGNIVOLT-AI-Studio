
name: IGNIVOLT Script Draft

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Electrical video topic"
        required: true
        type: string
      duration:
        description: "Choose video duration"
        required: true
        type: choice
        options:
          - "40"
          - "60"
          - "600"

permissions:
  contents: read

jobs:
  create-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate script draft
        env:
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_DURATION: ${{ inputs.duration }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from app.script_generator import build_script

          topic = os.environ["VIDEO_TOPIC"].strip()
          duration = int(os.environ["VIDEO_DURATION"])

          plan = build_script(topic, duration)

          output_dir = Path("production/video_drafts")
          output_dir.mkdir(parents=True, exist_ok=True)

          output_file = output_dir / "video_plan.json"
          output_file.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Script draft created: {output_file}")
          PY

      - name: Upload script draft
        uses: actions/upload-artifact@v4
        with:
          name: ignivolt-script-draft
          path: production/video_drafts/video_plan.json
          if-no-files-found: error
          retention-days: 7
          
